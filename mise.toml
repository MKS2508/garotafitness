# Warning: Do not unify this file with others. Keep tool definitions localized.
#
# Compilers and C/C++ build tools use the mise conda backend (conda:make,
# conda:gxx, conda:clang, conda:emscripten). Do not use host g++, nix shell,
# or registry clang. WASM guests use conda:emscripten (same pin as gameweb).
[tools]
go = "1.27.0"
goreleaser = "2.17.0"
svu = "3.3.0"
"conda:make" = "4.4.1"
"conda:gxx" = "16.2.0"
"conda:clang" = "23.1.0"
"conda:emscripten" = { version = "4.0.9", channel = "conda-forge" }

[tasks."install:tidy"]
description = "Tidy go.mod and go.sum"
run = "go mod tidy"

[tasks.install]
description = "Tidy Go modules"
depends = ["install:*"]

[tasks."fmt:go"]
description = "Format Go packages"
run = "go fmt ./..."

[tasks.fmt]
description = "Format all"
depends = ["fmt:*"]

[tasks."lint:vet"]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Lint all"
depends = ["lint:*"]

[tasks."test:go"]
description = "Run Go tests"
run = "go test -count=1 ./..."

[tasks.test]
description = "Run all tests"
depends = ["test:*"]

[tasks."build:srep"]
description = "Build SREP guest wasm with conda emscripten"
run = "make -C stream/srep"

[tasks."build:pref"]
description = "Build Precomp restore guest wasm with conda emscripten"
run = "make -C stream/pref"

[tasks."build:reconstruction"]
description = "Build the reconstruction and soundtrack WASM modules"
run = "make -C reconstruct/fsb && make -C reconstruct/x5 && make -C reconstruct/x5n && make -C reconstruct/sevenz && make -C reconstruct/fgpack && make -C reconstruct/xdelta && make -C stream/mpz && make -C stream/pref && make -C stream/xt2png && make -C stream/tor"

[tasks."build:garotafitness"]
description = "Build garotafitness into bin/"
depends = ["build:srep", "build:reconstruction"]
run = "go build -o bin/garotafitness ./cmd/garotafitness"

[tasks.build]
description = "Build all binaries"
depends = ["build:*"]

[tasks.ci]
description = "install, fmt, lint, test, build"
depends = ["install", "fmt", "lint", "test", "build"]

[tasks.release]
description = "Tag with svu and publish with goreleaser"
depends = ["ci"]
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = [
  "git tag $(svu ${usage_version})",
  "goreleaser release --clean",
]
